<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="splatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff862" />
      <stop offset="100%" stop-color="#e6b000" />
    </linearGradient>
    <linearGradient id="bananaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff677" />
      <stop offset="60%" stop-color="#ffd214" />
      <stop offset="100%" stop-color="#b58d00" />
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <g filter="url(#glow)">
    <!-- Liquid Splat Background Shape -->
    <path d="M 45,45
             C 52,25 35,15 48,12
             C 55,20 62,25 65,32
             C 78,24 88,38 78,48
             C 85,58 75,70 65,65
             C 58,78 42,88 32,72
             C 22,78 12,62 22,50
             C 12,38 28,25 35,38
             Z" 
          fill="url(#splatGrad)" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" />
          
    <!-- Splat Droplets fanning outwards -->
    <circle cx="20" cy="22" r="3" fill="#ffeb3b" stroke="#000000" stroke-width="1.8" />
    <circle cx="85" cy="25" r="2.5" fill="#ffeb3b" stroke="#000000" stroke-width="1.8" />
    <circle cx="80" cy="72" r="3.5" fill="#ffd54f" stroke="#000000" stroke-width="1.8" />
    <circle cx="24" cy="78" r="3" fill="#ffca28" stroke="#000000" stroke-width="1.8" />
    <circle cx="55" cy="85" r="2.5" fill="#ffeb3b" stroke="#000000" stroke-width="1.8" />
    
    <!-- Inside highlights on the splat to give it a liquid waxy gloss -->
    <path d="M 45,18 C 42,25 44,32 46,35" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M 72,35 C 75,40 73,46 70,48" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M 32,68 C 28,60 30,55 32,50" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Curved Banana Sitting on Top of the Splat -->
    <g transform="translate(5, 5) rotate(-15, 50, 50) scale(0.85)">
      <!-- Shadow -->
      <path d="M 50,18 C 32,25 20,42 22,65 C 21,72 23,78 26,81 C 28,78 30,71 31,64 C 32,44 41,27 50,18 Z" fill="#261c02" opacity="0.3" transform="translate(2, 4)" />
      <!-- Main Banana -->
      <path d="M 50,18 C 36,25 24,42 22,65 C 21,72 23,78 26,81 C 28,78 30,71 31,64 C 32,44 41,27 50,18 Z" fill="url(#bananaGrad)" stroke="#000000" stroke-width="2.5" />
      <path d="M 50,18 C 41,27 32,44 31,64 C 30,71 28,78 26,81 C 28,83 31,84 34,83 C 38,81 39,73 39,66 C 39,46 44,27 50,18 Z" fill="#fff159" stroke="#000000" stroke-width="1.5" />
      <path d="M 50,18 C 44,27 39,66 39,66 C 39,73 38,81 34,83 C 37,82 40,79 41,74 C 44,61 46,40 50,18 Z" fill="#d6a100" stroke="#000000" stroke-width="1.5" />
      
      <!-- Stem & Tip -->
      <path d="M 50,18 C 52,14 56,10 60,11 C 63,12 61,16 56,21 C 53,19 51,18 50,18 Z" fill="#556b10" stroke="#000000" stroke-width="2" />
      <path d="M 26,81 C 27,83 30,84 34,83 C 31,82 28,82 26,81 Z" fill="#2d1c0c" stroke="#000000" stroke-width="2" />
      
      <!-- Highlights -->
      <path d="M 47,22 C 38,30 29,45 28,62 C 28,64 29,66 29,62 C 30,47 38,32 47,22 Z" fill="#ffffff" opacity="0.45" />
    </g>
  </g>
</svg>